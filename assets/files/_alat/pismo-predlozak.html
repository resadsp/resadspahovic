<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{naslov}}</title>
<!--
  Predlozak propratnog pisma. Ne menja se za svaku prijavu — menja se samo
  datoteka sa podacima u `pisma/`, pa alat `napravi-pismo.py` spoji to dvoje.

  Zaglavlje je namerno isto kao na CV-ju: kad neko otvori oba dokumenta, vidi
  jedan komplet a ne dva nepovezana papira.

  Pismo je JEDNA strana. To nije stil nego pravilo: propratno pismo duze od
  strane niko ne procita do kraja.
-->
<style>
  @page { size: A4; margin: 16mm 17mm; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0; color: #1a2b42;
    font: 10pt/1.5 "Segoe UI", Calibri, Arial, Helvetica, sans-serif;
  }

  .ime {
    text-align: center; font-size: 19.5pt; font-weight: 700; letter-spacing: .02em;
    color: #1f3d6b; margin: 0 0 4px;
  }
  .zvanje {
    text-align: center; font-size: 10pt; color: #24405f;
    padding: 4px 0 5px; border-top: 1px solid #c9d6e4; border-bottom: 1px solid #c9d6e4;
  }
  .kontakt {
    text-align: center; font-size: 8.4pt; color: #5b7186;
    padding: 5px 0 6px; border-bottom: 1px solid #c9d6e4;
  }
  .kontakt a { color: #5b7186; text-decoration: none; }

  .datum { margin: 18px 0 14px; font-size: 9.2pt; color: #5b7186; text-align: right; }
  .primalac { font-size: 9.6pt; line-height: 1.4; margin-bottom: 16px; }
  .primalac b { color: #16233a; }
  .predmet {
    font-weight: 700; color: #24405f; margin-bottom: 14px; font-size: 10pt;
  }
  p { margin: 0 0 10px; text-align: justify; }
  .oslovljavanje { margin-bottom: 12px; }
  .pozdrav { margin-top: 18px; }
  .potpis { margin-top: 4px; font-weight: 700; color: #16233a; }
  .potpis-uz { font-size: 8.8pt; color: #5b7186; font-weight: 400; }
</style>
</head>
<body>

<div class="ime">RESAD SPAHOVIC</div>
<div class="zvanje">{{zvanje}}</div>
<div class="kontakt">
  Novi Pazar, Serbia | +381 62 266996 | resadspahovic94@gmail.com |
  <a href="https://www.linkedin.com/in/resad-spahovic-3a355b31a">LinkedIn: Resad Spahovic</a> |
  <a href="https://github.com/resadsp">GitHub: resadsp</a> |
  <a href="https://resadspahovic.com">resadspahovic.com</a>
</div>

<div class="datum">{{datum}}</div>

<div class="primalac">
  <b>{{primalac}}</b><br>
  {{firma}}{{grad}}
</div>

<div class="predmet">{{predmet}}</div>

<p class="oslovljavanje">{{oslovljavanje}}</p>

{{pasusi}}

<div class="pozdrav">{{pozdrav}}</div>
<div class="potpis">Resad Spahovic<br>
  <span class="potpis-uz">{{potpis_uz}}</span>
</div>

</body>
</html>
